name: CI

on: push

jobs:
  buildfront:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: npm
        cache-dependency-path: front/package-lock.json
    - name: Install dependency
      working-directory: front
      run: npm ci
    - name: Build front
      working-directory: front
      run: npm run build
    - name: Persist front build
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: ./dist
        if-no-files-found: error

  buildserver:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Vet
      run: go vet ./server/...
    - name: Test
      run: go test ./server/...
    - name: Install ARM cross compiler
      run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf
    - name: Build server for Raspberry Pi (ARMv7)
      env:
        CGO_ENABLED: '1'
        GOOS: linux
        GOARCH: arm
        GOARM: '7'
        CC: arm-linux-gnueabihf-gcc
      run: go build -o elsystem ./server
    - name: Persist server build
      uses: actions/upload-artifact@v4
      with:
        name: elsystem
        path: ./elsystem
        if-no-files-found: error
